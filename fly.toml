# ============================================================
# Fly.io — DS-160 Worker Configuration
# This is a Machine worker (not a web service).
# It processes one applicant, then exits.
# ============================================================

app = "ds160-worker"
primary_region = "iad"

[build]
  dockerfile = "automation/Dockerfile.ds160"

[env]
  HEADLESS = "false"
  DISPLAY = ":99"
  NODE_ENV = "production"

# No HTTP service — this is a worker process
# The machine runs, processes, and stops.

# Machine resources (non-headless Chrome needs more memory)
[[vm]]
  memory = "4gb"
  cpus = 2
