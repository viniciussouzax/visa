<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENDS160 — Login</title>
    <link rel="stylesheet" href="../mosaic.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #fff !important;
            color: #1e293b;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            box-sizing: border-box;
        }

        .login-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .15);
        }

        .login-input::placeholder {
            color: #94a3b8;
        }
    </style>
</head>

<body class="font-inter antialiased bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-400">

    <div class="fixed inset-0 z-50 bg-white dark:bg-gray-900">
        <div class="relative flex h-full">
            <!-- Content (left side) -->
            <div class="w-full md:w-1/2">
                <div class="min-h-[100dvh] h-full flex flex-col after:flex-1">
                    <!-- Header with logo -->
                    <div class="flex-1">
                        <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
                            <a class="block" href="#">
                                <img src="../images/logo-sends160.png" alt="SENDS160" style="height:28px;width:auto">
                            </a>
                        </div>
                    </div>
                    <!-- Login form -->
                    <div class="max-w-sm mx-auto w-full px-4 py-8">
                        <h1 class="text-2xl text-gray-800 dark:text-gray-100 font-bold mb-1">Bem-vindo</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Acesse o painel administrativo</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1" for="login-email">Email</label>
                                <input id="login-email" class="login-input" type="email" placeholder="seu@email.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1" for="login-password">Senha</label>
                                <input id="login-password" class="login-input" type="password" placeholder="••••••"
                                    autocomplete="on">
                            </div>
                        </div>
                        <div id="login-error" class="text-sm text-red-500 mt-3"></div>
                        <div class="mt-6">
                            <button id="btn-login" class="btn w-full text-white"
                                style="background:#3b82f6;padding:10px 20px;border-radius:6px;font-weight:600;border:none;cursor:pointer">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Image (right side) -->
            <div class="hidden md:block absolute top-0 bottom-0 right-0 md:w-1/2" aria-hidden="true">
                <img class="object-cover object-center w-full h-full" src="../images/auth-image.jpg" width="760"
                    height="1024" alt="Authentication image">
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zcpvknzktfmotvrybxdf.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcHZrbnprdGZtb3R2cnlieGRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MDk2MjIsImV4cCI6MjA4NjM4NTYyMn0.XaJG4V6NsQTYoU8I_wxHLyDEkVdPosqfJNm8nRHVjxg';
        const sb = supabase.createClient(SB_URL, SB_KEY);
        const $ = id => document.getElementById(id);

        // Check if already logged in
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) { window.location.href = 'index.html'; return; }
        })();

        $('btn-login').onclick = async () => {
            const email = $('login-email').value.trim();
            const pass = $('login-password').value;
            $('login-error').textContent = '';
            const { error } = await sb.auth.signInWithPassword({ email, password: pass });
            if (error) { $('login-error').textContent = error.message; return; }
            window.location.href = 'index.html';
        };

        // Allow Enter key to submit
        $('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
        $('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-password').focus(); });
    </script>
</body>

</html>
