<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS160 Expresso — Arquivados</title>
    <link rel="stylesheet" href="../mosaic.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script defer src="../alpinejs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="font-inter antialiased bg-gray-100 dark:bg-gray-900 text-gray-600 dark:text-gray-400"
    :class="{ 'sidebar-expanded': sidebarExpanded }" x-data="{ sidebarExpanded: true, sidebarOpen: false }"
    x-init="$watch('sidebarExpanded', value => localStorage.setItem('sidebar-expanded', value))">

    <div class="flex h-[100dvh] overflow-hidden">
        <div id="sidebar-container"></div>
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <div id="header-container"></div>
            <main class="grow">
                <div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-[96rem] mx-auto">
                    <!-- Search bar -->
                    <div class="sm:flex sm:justify-between sm:items-center mb-5">
                        <div class="relative w-full max-w-md">
                            <input id="search-archived" type="search" class="form-input w-full pl-10"
                                placeholder="Buscar nos arquivados...">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 fill-current text-gray-400"
                                viewBox="0 0 16 16">
                                <path
                                    d="M7 14c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zM7 2C4.243 2 2 4.243 2 7s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5z" />
                                <path
                                    d="M15.707 14.293L13.314 11.9a8.019 8.019 0 01-1.414 1.414l2.393 2.393a.997.997 0 001.414 0 .999.999 0 000-1.414z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Archived list -->
                    <div id="archived-list" class="space-y-2"></div>

                    <!-- Pagination -->
                    <div id="archived-pagination" class="mt-6 hidden">
                        <div class="flex justify-center">
                            <nav class="flex" role="navigation">
                                <div class="mr-2">
                                    <button id="arch-prev"
                                        class="inline-flex items-center justify-center rounded-lg leading-5 px-2.5 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/60 text-gray-300 dark:text-gray-600 shadow-xs disabled:opacity-50 disabled:cursor-not-allowed">
                                        <svg class="fill-current" width="16" height="16" viewBox="0 0 16 16">
                                            <path d="M9.4 13.4l1.4-1.4-4-4 4-4-1.4-1.4L4 8z" />
                                        </svg>
                                    </button>
                                </div>
                                <div class="ml-2">
                                    <button id="arch-next"
                                        class="inline-flex items-center justify-center rounded-lg leading-5 px-2.5 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/60 text-violet-500 shadow-xs disabled:opacity-50 disabled:cursor-not-allowed">
                                        <svg class="fill-current" width="16" height="16" viewBox="0 0 16 16">
                                            <path d="M6.6 13.4L5.2 12l4-4-4-4 1.4-1.4L12 8z" />
                                        </svg>
                                    </button>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/archived.js"></script>
</body>

</html>
