<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENDS160 — Detalhe</title>
    <link rel="stylesheet" href="../fonts.css">
    <link rel="stylesheet" href="../mosaic.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script defer src="../alpinejs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="font-inter antialiased bg-gray-100 dark:bg-gray-900 text-gray-600 dark:text-gray-400"
    :class="{ 'sidebar-expanded': sidebarExpanded }" x-data="{ sidebarExpanded: true, sidebarOpen: false }"
    x-init="$watch('sidebarExpanded', value => localStorage.setItem('sidebar-expanded', value))">

    <div class="flex h-[100dvh] overflow-hidden">
        <div id="sidebar-container"></div>
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <div id="header-container"></div>
            <main class="grow">
                <div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-[96rem] mx-auto">
                    <!-- Back button -->
                    <div class="mb-4">
                        <a href="index.html" class="text-sm text-violet-500 hover:text-violet-600 font-medium">&larr;
                            Voltar ao Pipeline</a>
                    </div>
                    <!-- Detail content -->
                    <div id="applicant-detail-content">
                        <div class="text-center py-20 text-sm text-gray-400">Carregando...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Process modal (iframe) -->
    <div id="process-modal">
        <div style="width:95vw;max-width:680px;height:90vh"
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl flex flex-col border border-gray-200 dark:border-gray-700/60"
            onclick="event.stopPropagation()">
            <div
                class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700/60 shrink-0">
                <div>
                    <h2 id="process-modal-name" class="text-lg font-bold text-gray-800 dark:text-gray-100"></h2>
                    <div id="process-modal-sub" class="mt-1"></div>
                </div>
                <button onclick="closeProcessModal()"
                    class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M18.3 5.71a1 1 0 0 0-1.42 0L12 10.59 7.12 5.71a1 1 0 0 0-1.42 1.42L10.59 12l-4.88 4.88a1 1 0 1 0 1.42 1.42L12 13.41l4.88 4.88a1 1 0 0 0 1.42-1.42L13.41 12l4.88-4.88a1 1 0 0 0 0-1.41Z" />
                    </svg>
                </button>
            </div>
            <iframe id="process-modal-iframe" class="grow w-full border-0 rounded-b-2xl" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Info/JSON modal -->
    <div id="info-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm"
        onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-2xl mx-4 max-h-[85vh] overflow-hidden border border-gray-200 dark:border-gray-700/60"
            onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700/60">
                <h2 id="modal-title" class="text-lg font-bold text-gray-800 dark:text-gray-100"></h2>
                <button id="modal-close" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M18.3 5.71a1 1 0 0 0-1.42 0L12 10.59 7.12 5.71a1 1 0 0 0-1.42 1.42L10.59 12l-4.88 4.88a1 1 0 1 0 1.42 1.42L12 13.41l4.88 4.88a1 1 0 0 0 1.42-1.42L13.41 12l4.88-4.88a1 1 0 0 0 0-1.41Z" />
                    </svg>
                </button>
            </div>
            <div id="modal-body" class="px-6 py-4 overflow-y-auto max-h-[65vh]"></div>
        </div>
    </div>

    <!-- Delete modal -->
    <div id="delete-modal">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 max-w-sm w-full mx-4 text-center border border-gray-200 dark:border-gray-700/60"
            onclick="event.stopPropagation()">
            <div
                class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-500/20 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6 fill-current text-red-500" viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-2">Excluir Solicitante</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Deseja excluir <strong id="delete-modal-name"
                    class="text-gray-800 dark:text-gray-100"></strong> e todos os dependentes?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeDeleteModal()"
                    class="btn bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:border-gray-300">Cancelar</button>
                <button id="delete-confirm-btn" onclick="confirmDelete()"
                    class="btn bg-red-500 hover:bg-red-600 text-white">Excluir</button>
            </div>
        </div>
    </div>

    <!-- Logs timeline modal -->
    <div id="logs-modal"
        style="display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(17,24,39,0.5);backdrop-filter:blur(4px)"
        onclick="if(event.target===this)closeLogsModal()">
        <div style="width:100%;max-width:680px;max-height:85vh;margin:0 16px;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.15);border:1px solid #e5e7eb;display:flex;flex-direction:column"
            onclick="event.stopPropagation()">
            <div
                style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #e5e7eb;flex-shrink:0">
                <div style="display:flex;align-items:center;gap:10px">
                    <span style="font-size:20px">📋</span>
                    <h2 id="logs-modal-title" style="font-size:18px;font-weight:700;color:#1f2937;margin:0">Logs do
                        Processo</h2>
                </div>
                <button onclick="closeLogsModal()"
                    style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:20px;padding:4px">&times;</button>
            </div>
            <div id="logs-modal-body" style="padding:16px 24px;overflow-y:auto;flex:1;max-height:calc(85vh - 70px)">
                <div style="text-align:center;padding:32px 0;color:#9ca3af;font-size:14px">Carregando logs...</div>
            </div>
        </div>
    </div>

    <!-- Screenshot lightbox -->
    <div id="screenshot-lightbox"
        class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm cursor-pointer"
        onclick="this.classList.add('hidden')">
        <img id="screenshot-lightbox-img" src="" alt="Screenshot"
            style="max-width:92vw;max-height:90vh;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.5)">
    </div>

    <!-- HTML viewer modal (master only) -->
    <div id="html-viewer-modal"
        class="hidden fixed inset-0 z-[55] flex items-center justify-center bg-gray-900/50 backdrop-blur-sm"
        onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-4xl mx-4 max-h-[85vh] overflow-hidden border border-gray-200 dark:border-gray-700/60"
            onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700/60">
                <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100">🔍 HTML da Página</h2>
                <button onclick="$('html-viewer-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M18.3 5.71a1 1 0 0 0-1.42 0L12 10.59 7.12 5.71a1 1 0 0 0-1.42 1.42L10.59 12l-4.88 4.88a1 1 0 1 0 1.42 1.42L12 13.41l4.88 4.88a1 1 0 0 0 1.42-1.42L13.41 12l4.88-4.88a1 1 0 0 0 0-1.41Z" />
                    </svg>
                </button>
            </div>
            <pre id="html-viewer-body"
                class="px-6 py-4 overflow-auto max-h-[65vh] text-xs text-gray-600 dark:text-gray-300"
                style="white-space:pre-wrap;word-break:break-all;font-family:monospace"></pre>
        </div>
    </div>

    <style>
        /* Timeline styles */
        .logs-timeline {
            position: relative;
            padding-left: 24px;
        }

        .logs-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e5e7eb;
            border-radius: 1px;
        }

        .dark .logs-timeline::before {
            background: #374151;
        }

        .log-entry {
            position: relative;
            margin-bottom: 16px;
            padding: 12px 14px;
            background: #f9fafb;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            transition: box-shadow 0.15s;
        }

        .dark .log-entry {
            background: #1f2937;
            border-color: #374151;
        }

        .log-entry:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .log-entry::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #d1d5db;
            background: white;
        }

        .dark .log-entry::before {
            border-color: #4b5563;
            background: #111827;
        }

        .log-entry.log-error::before {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .log-entry.log-warning::before {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .log-entry.log-success::before {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .log-entry.log-info::before {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .log-time {
            font-size: 11px;
            color: #9ca3af;
            font-family: monospace;
        }

        .log-page-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            background: #3b82f615;
            color: #3b82f6;
            font-weight: 600;
        }

        .log-type-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .log-message {
            font-size: 13px;
            color: #374151;
            line-height: 1.5;
        }

        .dark .log-message {
            color: #d1d5db;
        }

        .log-details {
            font-size: 11px;
            color: #6b7280;
            margin-top: 6px;
        }

        .log-details code {
            background: #f3f4f6;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
        }

        .dark .log-details code {
            background: #374151;
        }

        .log-screenshot {
            margin-top: 8px;
            border-radius: 6px;
            max-width: 200px;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            transition: transform 0.15s;
        }

        .log-screenshot:hover {
            transform: scale(1.03);
        }

        .log-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .log-actions button {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }

        .dark .log-actions button {
            background: #374151;
            border-color: #4b5563;
            color: #d1d5db;
        }

        .log-actions button:hover {
            background: #f3f4f6;
        }

        .dark .log-actions button:hover {
            background: #4b5563;
        }

        .log-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .log-stat {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f3f4f6;
            color: #6b7280;
        }

        .dark .log-stat {
            background: #374151;
            color: #9ca3af;
        }

        .log-empty {
            text-align: center;
            padding: 32px 16px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>

    <script src="../js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/applicant.js"></script>
</body>

</html>
