<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Acesso Negado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    borderRadius: { DEFAULT: '5px' },
                    fontFamily: { sans: ['sohne', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="fonts.css">
    <script>
            // GitHub Pages 404 redirect: /visa/SHORT_ID → /visa/ds160?org=SHORT_ID
            (function () {
                var path = location.pathname;
                if (path.endsWith('/')) path = path.slice(0, -1);
                var parts = path.split('/');
                var lastPart = parts[parts.length - 1];
                var knownPaths = ['ds160', 'dashboard.html', 'painel.html', 'visa', 'privacy-policy.html', ''];
                if (lastPart && knownPaths.indexOf(lastPart) === -1 && lastPart.indexOf('.') === -1) {
                    var basePath = parts.slice(0, parts.length - 1).join('/');
                    location.replace(basePath + '/ds160?org=' + lastPart);
                }
            })();
    </script>
</head>

<body class="font-sans bg-blue-50 text-slate-800 min-h-screen flex items-center justify-center overflow-hidden">

    <!-- Background pattern -->
    <div
        class="fixed inset-0 bg-[radial-gradient(circle_at_20%_30%,rgba(59,130,246,0.06)_0%,transparent_50%),radial-gradient(circle_at_80%_70%,rgba(59,130,246,0.04)_0%,transparent_50%),radial-gradient(circle_at_50%_50%,rgba(59,130,246,0.02)_0%,transparent_60%)]">
    </div>

    <div class="relative z-10 text-center px-6 max-w-md">

        <!-- 404 code -->
        <div
            class="text-8xl font-extrabold bg-gradient-to-br from-blue-500 to-blue-600 bg-clip-text text-transparent leading-none mb-3 tracking-tighter">
            404
        </div>

        <!-- Dots -->
        <div class="flex gap-1.5 justify-center mb-8">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-300"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-blue-300"></span>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-3">Acesso Negado</h1>
        <p class="text-sm text-slate-500 leading-relaxed mb-8">A página que você está procurando não existe, foi movida
            ou você não tem permissão para acessá-la.</p>

        <a href="dashboard.html"
            class="inline-flex items-center gap-2 rounded-lg bg-blue-500 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-blue-500/30 transition-all active:translate-y-0 uppercase">
            Voltar ao Início
        </a>

        <p class="mt-12 text-xs text-slate-400">Se o problema persistir, entre em contato com o suporte.</p>
    </div>
</body>

</html>
