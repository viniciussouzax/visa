<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
    h1 { font-size: 14px; color: #7c83ff; margin-bottom: 12px; }
    .status { padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    .status.on { background: #1b5e20; }
    .status.off { background: #333; }
    .status.err { background: #b71c1c; }
    .config { margin-bottom: 12px; }
    label { font-size: 11px; color: #999; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #333; border-radius: 4px; background: #0f0f1a; color: #eee; font-size: 12px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-toggle { background: #7c83ff; color: #fff; margin-bottom: 8px; }
    .btn-toggle.running { background: #f44336; }
    .btn-save { background: #333; color: #aaa; font-size: 11px; }
    .btn-save:hover { background: #444; }
    .task { font-size: 12px; color: #aaa; margin-top: 8px; }
    .task strong { color: #fff; }
  </style>
</head>
<body>
  <h1>🤖 DS-160 & AIS Worker</h1>

  <div id="statusBox" class="status off">⏸ Desligado</div>

  <button id="btnToggle" class="btn-toggle">▶ Ligar</button>

  <div class="task" id="taskInfo"></div>

  <hr style="border-color: #333; margin: 12px 0;">

  <div class="config">
    <label>Supabase URL</label>
    <input type="text" id="supaUrl" placeholder="https://xxx.supabase.co">
    <label>Supabase Anon Key</label>
    <input type="password" id="supaKey" placeholder="eyJ...">
    <button id="btnSave" class="btn-save">💾 Salvar Configuração</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
