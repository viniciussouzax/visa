<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
    h1 { font-size: 14px; color: #7c83ff; margin-bottom: 12px; }
    .status { padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    .status.on { background: #1b5e20; }
    .status.off { background: #333; }
    .status.err { background: #b71c1c; }
    .section { margin-bottom: 12px; }
    label { font-size: 11px; color: #999; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #333; border-radius: 4px; background: #0f0f1a; color: #eee; font-size: 12px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
    .btn-toggle { background: #7c83ff; color: #fff; }
    .btn-toggle.running { background: #f44336; }
    .btn-login { background: #4CAF50; color: #fff; }
    .btn-logout { background: #333; color: #f44336; font-size: 11px; }
    .task { font-size: 12px; color: #aaa; margin-top: 8px; }
    .task strong { color: #fff; }
    .user-info { font-size: 11px; color: #7c83ff; margin-bottom: 8px; padding: 6px 8px; background: #0f0f1a; border-radius: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>🤖 DS-160 & AIS Worker</h1>

  <!-- Login Section (shown when not authenticated) -->
  <div id="loginSection" class="section">
    <div class="status err">🔒 Faça login para começar</div>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="assessor@empresa.com">
    <label>Senha</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button id="btnLogin" class="btn-login">🔐 Entrar</button>
    <div id="loginError" style="color: #f44336; font-size: 11px; margin-top: 4px;"></div>
  </div>

  <!-- Worker Section (shown when authenticated) -->
  <div id="workerSection" class="section hidden">
    <div id="userInfo" class="user-info"></div>
    <div id="statusBox" class="status off">⏸ Desligado</div>
    <button id="btnToggle" class="btn-toggle">▶ Ligar</button>
    <div class="task" id="taskInfo"></div>
    <hr style="border-color: #333; margin: 12px 0;">
    <button id="btnLogout" class="btn-logout">Sair</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
