<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>SENDS160</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           SENDS160 Software — Design System
           Tema escuro, compacto, inspirado no Headless Recorder.
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #22262b;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-app-region: drag;
            overflow: hidden;
        }

        button,
        input,
        a {
            -webkit-app-region: no-drag;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        /* --- Variables --- */
        :root {
            --bg-primary: #1a1d21;
            --bg-card: #22262b;
            --bg-elevated: #2d3139;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --blue: #58a6ff;
            --blue-dim: #1f6feb;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
            --radius: 8px;
        }

        /* --- Header bar --- */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            min-height: 48px;
        }

        .header-bar .logo {
            height: 18px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: .85;
        }

        .header-bar .version {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* --- Tabs --- */
        .tab-bar {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .2s;
            font-family: inherit;
            text-transform: none;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        /* --- Tab content --- */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- Main view --- */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            gap: 12px;
            overflow-y: auto;
            width: 100%;
        }

        /* --- Status hero (big circle like Headless Recorder) --- */
        .status-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            gap: 12px;
            flex: 1;
        }

        .status-circle {
            width: 180px;
            height: 180px;
            min-width: 180px;
            min-height: 180px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all .3s ease;
            position: relative;
            overflow: visible;
            cursor: default;
        }

        .status-circle.idle {
            cursor: pointer;
            background: var(--blue-dim);
            box-shadow: 0 0 0 6px rgba(31, 111, 235, .12), 0 0 20px rgba(31, 111, 235, .15);
            animation: pulse-wave-blue 3s ease-in-out infinite;
        }

        .status-circle.running {
            background: var(--green);
            box-shadow: 0 0 0 6px rgba(63, 185, 80, .12), 0 0 20px rgba(63, 185, 80, .15);
            animation: pulse-wave-green 2.5s ease-in-out infinite;
        }

        .status-circle.error {
            background: var(--red);
            box-shadow: 0 0 0 6px rgba(248, 81, 73, .12), 0 0 20px rgba(248, 81, 73, .15);
            animation: pulse-wave-red 2s ease-in-out infinite;
        }

        .status-circle.warning {
            background: var(--yellow);
            box-shadow: 0 0 0 6px rgba(210, 153, 34, .12), 0 0 20px rgba(210, 153, 34, .15);
            animation: pulse-wave-amber 2.5s ease-in-out infinite;
        }

        .status-circle.stopped {
            background: var(--text-muted);
            box-shadow: 0 0 0 6px rgba(72, 79, 88, .1);
        }

        .status-circle svg.status-icon {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        .status-circle .circle-timer {
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, .9);
            letter-spacing: .02em;
            font-variant-numeric: tabular-nums;
        }

        .circle-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, .25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Soft expanding wave pulse — green (idle) */
        @keyframes pulse-wave-green {
            0% {
                box-shadow:
                    0 0 0 0 rgba(63, 185, 80, .35),
                    0 0 0 0 rgba(63, 185, 80, .20),
                    0 0 0 0 rgba(63, 185, 80, .10),
                    0 0 25px rgba(63, 185, 80, .15);
            }

            50% {
                box-shadow:
                    0 0 0 15px rgba(63, 185, 80, .15),
                    0 0 0 30px rgba(63, 185, 80, .08),
                    0 0 0 45px rgba(63, 185, 80, .03),
                    0 0 60px rgba(63, 185, 80, .25);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(63, 185, 80, .35),
                    0 0 0 0 rgba(63, 185, 80, .20),
                    0 0 0 0 rgba(63, 185, 80, .10),
                    0 0 25px rgba(63, 185, 80, .15);
            }
        }

        /* Soft expanding wave pulse — blue (running) */
        @keyframes pulse-wave-blue {
            0% {
                box-shadow:
                    0 0 0 0 rgba(31, 111, 235, .40),
                    0 0 0 0 rgba(88, 166, 255, .20),
                    0 0 0 0 rgba(88, 166, 255, .10),
                    0 0 25px rgba(31, 111, 235, .15);
            }

            50% {
                box-shadow:
                    0 0 0 16px rgba(31, 111, 235, .12),
                    0 0 0 32px rgba(88, 166, 255, .06),
                    0 0 0 48px rgba(88, 166, 255, .03),
                    0 0 65px rgba(31, 111, 235, .30);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(31, 111, 235, .40),
                    0 0 0 0 rgba(88, 166, 255, .20),
                    0 0 0 0 rgba(88, 166, 255, .10),
                    0 0 25px rgba(31, 111, 235, .15);
            }
        }

        /* Soft expanding wave pulse — red (error) */
        @keyframes pulse-wave-red {
            0% {
                box-shadow:
                    0 0 0 0 rgba(248, 81, 73, .40),
                    0 0 0 0 rgba(248, 81, 73, .20),
                    0 0 0 0 rgba(248, 81, 73, .10),
                    0 0 25px rgba(248, 81, 73, .15);
            }

            50% {
                box-shadow:
                    0 0 0 14px rgba(248, 81, 73, .12),
                    0 0 0 28px rgba(248, 81, 73, .06),
                    0 0 0 42px rgba(248, 81, 73, .03),
                    0 0 55px rgba(248, 81, 73, .28);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(248, 81, 73, .40),
                    0 0 0 0 rgba(248, 81, 73, .20),
                    0 0 0 0 rgba(248, 81, 73, .10),
                    0 0 25px rgba(248, 81, 73, .15);
            }
        }

        /* Soft expanding wave pulse — amber (warning) */
        @keyframes pulse-wave-amber {
            0% {
                box-shadow:
                    0 0 0 0 rgba(210, 153, 34, .35),
                    0 0 0 0 rgba(210, 153, 34, .20),
                    0 0 0 0 rgba(210, 153, 34, .10),
                    0 0 25px rgba(210, 153, 34, .15);
            }

            50% {
                box-shadow:
                    0 0 0 14px rgba(210, 153, 34, .12),
                    0 0 0 28px rgba(210, 153, 34, .06),
                    0 0 0 42px rgba(210, 153, 34, .03),
                    0 0 55px rgba(210, 153, 34, .22);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(210, 153, 34, .35),
                    0 0 0 0 rgba(210, 153, 34, .20),
                    0 0 0 0 rgba(210, 153, 34, .10),
                    0 0 25px rgba(210, 153, 34, .15);
            }
        }

        .status-label {
            display: none;
        }

        .status-detail {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 50px;
        }

        /* --- Timer badge (hidden — timer is now inside circle) --- */
        .timer-badge {
            display: none;
        }



        /* --- Login form --- */
        .login-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 16px;
            -webkit-app-region: no-drag;
        }

        .login-view .logo-big {
            height: 24px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: .9;
            margin-bottom: 4px;
        }

        .login-view .field {
            width: 100%;
            max-width: 280px;
        }

        .login-view label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 6px;
        }

        .login-view input[type="email"],
        .login-view input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }

        .login-view input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, .15);
        }

        .login-view input::placeholder {
            color: var(--text-muted);
        }

        .login-view .remember-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 280px;
        }

        .login-view .remember-row input {
            accent-color: var(--blue);
        }

        .login-view .remember-row label {
            text-transform: none;
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .btn-login {
            width: 100%;
            max-width: 280px;
            padding: 12px;
            background: var(--blue-dim);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: .02em;
        }

        .btn-login:hover {
            background: #388bfd;
        }

        .btn-login:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .login-error {
            font-size: 11px;
            color: var(--red);
            text-align: center;
            min-height: 16px;
        }

        /* --- Log panel --- */
        .log-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            /* Fix: allow flex child to shrink below content size */
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .log-header span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .log-header button {
            background: none;
            border: none;
            font-size: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
        }

        .log-header button:hover {
            color: var(--text-secondary);
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            /* Fix: required for overflow-y:auto inside flex */
            padding: 8px 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: var(--bg-primary);
        }

        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(48, 54, 61, .3);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .log-line .time {
            color: var(--text-muted);
            margin-right: 6px;
        }

        /* --- User bar --- */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            min-height: 36px;
        }

        .user-bar .email {
            font-size: 11px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }

        .user-bar .btn-logout {
            background: none;
            border: none;
            font-size: 10px;
            font-weight: 600;
            color: var(--red);
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        .user-bar .btn-logout:hover {
            opacity: .8;
        }

        /* --- Utility --- */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ====== LOGIN VIEW ====== -->
    <div id="login-section" class="login-view">
        <img src="logo-sends160.png" alt="SENDS160" class="logo-big"
            onerror="this.outerHTML='<span style=font-size:18px;font-weight:700;color:#58a6ff>SENDS160</span>'">
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Automação DS-160</p>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>
        <div class="field">
            <label>Senha</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <div class="remember-row">
            <input type="checkbox" id="remember" checked>
            <label for="remember">Lembrar meu login</label>
        </div>
        <button id="btn-login" class="btn-login">Entrar</button>
        <p class="login-error" id="login-error"></p>
    </div>

    <!-- ====== MAIN VIEW (hidden until login) ====== -->
    <div id="main-section" class="hidden" style="display:none;flex-direction:column;height:100vh">

        <!-- Header -->
        <div class="header-bar">
            <img src="logo-sends160.png" alt="SENDS160" class="logo"
                onerror="this.outerHTML='<span style=font-size:13px;font-weight:700;color:#58a6ff>SENDS160</span>'">
            <span class="version">v...</span>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="home">Início</button>
            <button class="tab-btn" data-tab="logs">Logs</button>
        </div>

        <!-- TAB: Home -->
        <div id="tab-home" class="tab-content active">
            <!-- Status hero -->
            <div class="status-hero">
                <div id="status-circle" class="status-circle idle">
                    <span id="circle-timer" class="circle-timer"></span>
                </div>
                <div id="status-text" class="status-label"></div>
                <div id="status-detail" class="status-detail">Ativo e aguardando</div>
                <div id="timer-row" class="timer-badge"></div>
            </div>
        </div>

        <!-- TAB: Logs -->
        <div id="tab-logs" class="tab-content">
            <div class="log-panel">
                <div class="log-header">
                    <span>Registros de atividade</span>
                    <div style="display:flex;gap:8px;">
                        <button id="btn-copy-logs" title="Copiar logs">📋 Copiar</button>
                        <button id="btn-clear-logs">Limpar</button>
                    </div>
                </div>
                <div class="log-body" id="log"></div>
            </div>
        </div>

        <!-- User bar (bottom) -->
        <div class="user-bar">
            <span class="email" id="user-email">—</span>
            <button id="btn-logout" class="btn-logout">Sair</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
