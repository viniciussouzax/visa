<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DS-160 Filler</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #374151;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --input-bg: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .header {
            background: var(--surface);
            padding: 16px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Login Section */
        #login-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #main-section {
            display: none;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .checkbox-row input[type="checkbox"] {
            accent-color: var(--primary);
        }

        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-refresh {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-refresh:hover {
            background: var(--primary-light);
        }

        .btn-update {
            background: var(--surface);
            color: var(--warning);
            border: 1px solid var(--warning);
            font-size: 12px;
            padding: 8px 16px;
        }

        .btn-update:hover {
            background: #fffbeb;
        }

        .btn-update:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status */
        .status-card {
            background: var(--surface);
            border-radius: 5px;
            padding: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: var(--text-muted);
        }

        .status-value {
            font-weight: 600;
            color: var(--text);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .dot-green {
            background: var(--success);
        }

        .dot-yellow {
            background: var(--warning);
            animation: pulse-dot 1.5s infinite;
        }

        .dot-gray {
            background: var(--text-faint);
        }

        .dot-red {
            background: var(--error);
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .timer-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .error {
            color: var(--error);
            font-size: 12px;
            text-align: center;
        }

        .log {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: auto;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Consolas', monospace;
            line-height: 1.5;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px 10px;
        }

        /* Footer / Support */
        .footer {
            padding: 12px 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-faint);
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .footer a {
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .user-bar span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .btn-logout {
            background: none;
            border: none;
            color: var(--error);
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-logout:hover {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="header">DS-160 FILLER</div>
    <div class="content">

        <!-- LOGIN -->
        <div id="login-section">
            <div>
                <label>Email</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="remember" checked>
                <label for="remember" style="color:var(--text-secondary);margin:0;cursor:pointer">Lembrar meu
                    login</label>
            </div>
            <button class="btn-primary" id="btn-login">Entrar</button>
            <p class="error" id="login-error"></p>
        </div>

        <!-- MAIN -->
        <div id="main-section">
            <div class="user-bar">
                <span id="user-email">—</span>
                <button class="btn-logout" id="btn-logout">Sair</button>
            </div>

            <div class="status-card">
                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span class="status-value" id="status-text"><span class="dot dot-green"></span>Ativo</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Fila</span>
                    <span class="status-value" id="queue-count">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Atual</span>
                    <span class="status-value" id="current-task">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Página</span>
                    <span class="status-value" id="current-page">—</span>
                </div>
                <div class="status-row" id="timer-row" style="display:none;">
                    <span class="status-label">Próxima verificação</span>
                    <span class="timer-badge" id="timer-text">—</span>
                </div>
            </div>

            <button class="btn-refresh" id="btn-refresh">Verificar fila agora</button>
            <button class="btn-update" id="btn-update">Fechar e Atualizar</button>

            <div class="log" id="log"></div>
        </div>
    </div>

    <div class="footer">
        Suporte: <span style="color:#25d366;font-weight:600">WhatsApp +55 11 98894-5503</span>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
