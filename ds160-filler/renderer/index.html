<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DS160 EXPRESSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    borderRadius: { DEFAULT: '5px' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .animate-pulse-dot {
            animation: pulse-dot 1.5s infinite;
        }
    </style>
</head>

<body class="font-sans bg-slate-50 text-slate-800 h-screen flex flex-col select-none">

    <!-- Header -->
    <div
        class="bg-white px-5 py-4 text-center text-lg font-bold tracking-wide text-blue-500 border-b-2 border-blue-500 shadow-sm">
        DS160 EXPRESSO
    </div>

    <div class="flex-1 p-5 flex flex-col gap-3.5">

        <!-- LOGIN -->
        <div id="login-section" class="flex flex-col gap-3">
            <div>
                <label class="text-xs font-medium text-slate-500 mb-0.5 block">Email</label>
                <input type="email" id="email" placeholder="seu@email.com"
                    class="w-full px-3.5 py-2.5 rounded border border-slate-200 bg-slate-50 text-slate-800 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-[3px] focus:ring-blue-500/10">
            </div>
            <div>
                <label class="text-xs font-medium text-slate-500 mb-0.5 block">Senha</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 rounded border border-slate-200 bg-slate-50 text-slate-800 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-[3px] focus:ring-blue-500/10">
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <input type="checkbox" id="remember" checked class="accent-blue-500">
                <label for="remember" class="text-slate-600 cursor-pointer">Lembrar meu login</label>
            </div>
            <button
                class="btn-primary bg-blue-500 text-white py-2.5 px-5 rounded text-sm font-semibold transition-all hover:bg-blue-600 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-blue-500/30"
                id="btn-login">Entrar</button>
            <p class="error text-red-500 text-xs text-center" id="login-error"></p>
        </div>

        <!-- MAIN -->
        <div id="main-section" class="hidden flex-col gap-3.5 flex-1">
            <!-- User bar -->
            <div class="flex justify-between items-center text-xs text-slate-500">
                <span id="user-email" class="overflow-hidden text-ellipsis whitespace-nowrap max-w-[200px]">—</span>
                <button
                    class="btn-logout bg-transparent border-none text-red-500 text-[11px] cursor-pointer px-2 py-1 hover:text-red-600"
                    id="btn-logout">Sair</button>
            </div>

            <!-- Status card -->
            <div class="bg-white rounded border border-slate-200 p-3.5 shadow-sm">
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Status</span>
                    <span class="font-semibold text-slate-800" id="status-text">
                        <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5"></span>Ativo
                    </span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Fila</span>
                    <span class="font-semibold text-slate-800" id="queue-count">—</span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Atual</span>
                    <span class="font-semibold text-slate-800" id="current-task">—</span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Página</span>
                    <span class="font-semibold text-slate-800" id="current-page">—</span>
                </div>
                <div class="flex justify-between text-[13px]" id="timer-row" style="display:none;">
                    <span class="text-slate-500">Próxima verificação</span>
                    <span class="bg-blue-50 text-blue-500 px-2 py-0.5 rounded text-xs font-semibold"
                        id="timer-text">—</span>
                </div>
            </div>

            <!-- Buttons -->
            <button
                class="btn-refresh bg-white text-blue-500 border border-blue-500 py-2.5 px-5 rounded text-sm font-semibold transition-all hover:bg-blue-50"
                id="btn-refresh">Verificar fila agora</button>
            <button
                class="btn-update bg-white text-amber-500 border border-amber-500 py-2 px-4 rounded text-xs font-semibold transition-all hover:bg-amber-50 disabled:opacity-50 disabled:cursor-not-allowed"
                id="btn-update">Fechar e Atualizar</button>

            <!-- Log -->
            <div class="log mt-auto max-h-[100px] overflow-y-auto font-mono text-[11px] text-slate-400 leading-normal bg-white border border-slate-200 rounded p-2"
                id="log"></div>
        </div>
    </div>

    <!-- Footer -->
    <div class="py-3 px-5 text-center text-[11px] text-slate-400 border-t border-slate-200 bg-white">
        Suporte: <span class="text-green-500 font-semibold">WhatsApp +55 11 98894-5503</span>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
