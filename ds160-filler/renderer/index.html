<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DS160 EXPRESSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    borderRadius: { DEFAULT: '5px' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .animate-pulse-dot {
            animation: pulse-dot 1.5s infinite;
        }

        /* --- Align with Clone form design tokens --- */
        input[type="email"],
        input[type="password"] {
            padding: 12px 14px !important;
            border: 1px solid #d1d5db !important;
            border-radius: 5px !important;
            background: #fff !important;
            font-size: 16px !important;
            line-height: 1.5 !important;
            color: #111827 !important;
            font-family: 'Inter', system-ui, sans-serif !important;
            transition: border-color .2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1) !important;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        button {
            font-family: 'Inter', system-ui, sans-serif;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="font-sans bg-slate-50 text-slate-800 h-screen flex flex-col select-none antialiased">

    <!-- Header -->
    <div
        class="bg-white px-5 py-4 text-center text-lg font-bold tracking-wide text-blue-500 border-b-2 border-blue-500 shadow-sm">
        DS160 EXPRESSO
    </div>

    <div class="flex-1 p-5 flex flex-col gap-3.5">

        <!-- LOGIN -->
        <div id="login-section" class="flex flex-col gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
                <input type="email" id="email" placeholder="seu@email.com"
                    class="block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Senha</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <input type="checkbox" id="remember" checked class="accent-blue-500 rounded">
                <label for="remember" class="text-slate-600 cursor-pointer">Lembrar meu login</label>
            </div>
            <button id="btn-login"
                class="w-full rounded bg-blue-500 text-white shadow-sm hover:bg-blue-600 transition-all"
                style="padding:12px 24px;font-size:14px;font-weight:600">Entrar</button>
            <p class="text-red-500 text-xs text-center" id="login-error"></p>
        </div>

        <!-- MAIN -->
        <div id="main-section" class="hidden flex-col gap-3.5 flex-1">
            <!-- User bar -->
            <div class="flex justify-between items-center text-xs text-slate-500">
                <span id="user-email" class="overflow-hidden text-ellipsis whitespace-nowrap max-w-[200px]">—</span>
                <button id="btn-logout"
                    class="bg-transparent border-none text-red-500 text-[11px] cursor-pointer px-2 py-1 hover:text-red-600 uppercase">Sair</button>
            </div>

            <!-- Status card -->
            <div class="overflow-hidden rounded bg-white shadow-sm border border-gray-200 p-4">
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Status</span>
                    <span class="font-semibold text-slate-800" id="status-text">
                        <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5"></span>Ativo
                    </span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Fila</span>
                    <span class="font-semibold text-slate-800" id="queue-count">—</span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Atual</span>
                    <span class="font-semibold text-slate-800" id="current-task">—</span>
                </div>
                <div class="flex justify-between mb-2 text-[13px]">
                    <span class="text-slate-500">Página</span>
                    <span class="font-semibold text-slate-800" id="current-page">—</span>
                </div>
                <div class="flex justify-between text-[13px]" id="timer-row" style="display:none;">
                    <span class="text-slate-500">Próxima verificação</span>
                    <span class="bg-blue-50 text-blue-500 px-2 py-0.5 rounded-md text-xs font-semibold"
                        id="timer-text">—</span>
                </div>
            </div>

            <!-- Buttons -->
            <button id="btn-refresh"
                class="w-full rounded bg-white text-blue-500 ring-1 ring-blue-500 hover:bg-blue-50 transition-all"
                style="padding:12px 24px;font-size:14px;font-weight:600">Verificar fila agora</button>
            <button id="btn-update"
                class="w-full rounded bg-white text-amber-500 ring-1 ring-amber-500 hover:bg-amber-50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                style="padding:10px 24px;font-size:13px;font-weight:600">Fechar e Atualizar</button>

            <!-- Log -->
            <div class="mt-auto max-h-[100px] overflow-y-auto font-mono text-[11px] text-slate-400 leading-normal overflow-hidden rounded bg-white border border-gray-200 p-2"
                id="log"></div>
        </div>
    </div>

    <!-- Footer -->
    <div class="py-3 px-5 text-center text-[11px] text-slate-400 border-t border-slate-200 bg-white">
        Suporte: <span class="text-green-500 font-semibold">WhatsApp +55 11 98894-5503</span>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
