<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DS-160 Filler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 16px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 2px solid #e94560;
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Login Section */
        #login-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #main-section {
            display: none;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 2px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #16213e;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #e94560;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
        }

        .checkbox-row input[type="checkbox"] {
            accent-color: #e94560;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c62a47);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        .btn-refresh {
            background: #16213e;
            color: #e94560;
            border: 1px solid #e94560;
        }

        .btn-refresh:hover {
            background: #1e293b;
        }

        .btn-update {
            background: #16213e;
            color: #f39c12;
            border: 1px solid #f39c12;
            font-size: 12px;
            padding: 8px 16px;
        }

        .btn-update:hover {
            background: #1e293b;
        }

        .btn-update:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status */
        .status-card {
            background: #16213e;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #333;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: #888;
        }

        .status-value {
            font-weight: 600;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .dot-green {
            background: #2ecc71;
        }

        .dot-yellow {
            background: #f39c12;
            animation: pulse-dot 1.5s infinite;
        }

        .dot-gray {
            background: #666;
        }

        .dot-red {
            background: #e74c3c;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .timer-badge {
            background: rgba(233, 69, 96, 0.15);
            color: #e94560;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
        }

        .log {
            font-size: 11px;
            color: #666;
            margin-top: auto;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.5;
        }

        /* Footer / Support */
        .footer {
            padding: 12px 20px;
            text-align: center;
            font-size: 11px;
            color: #555;
            border-top: 1px solid #222;
        }

        .footer a {
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }

        .user-bar span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #e94560;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
        }
    </style>
</head>

<body>
    <div class="header">⚡ DS-160 FILLER</div>
    <div class="content">

        <!-- LOGIN -->
        <div id="login-section">
            <div>
                <label>Email</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="remember" checked>
                <label for="remember" style="color:#ccc;margin:0;cursor:pointer">Lembrar meu login</label>
            </div>
            <button class="btn-primary" id="btn-login">Entrar</button>
            <p class="error" id="login-error"></p>
        </div>

        <!-- MAIN -->
        <div id="main-section">
            <div class="user-bar">
                <span id="user-email">—</span>
                <button class="btn-logout" id="btn-logout">Sair</button>
            </div>

            <div class="status-card">
                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span class="status-value" id="status-text"><span class="dot dot-green"></span>Ativo</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Fila</span>
                    <span class="status-value" id="queue-count">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Atual</span>
                    <span class="status-value" id="current-task">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Página</span>
                    <span class="status-value" id="current-page">—</span>
                </div>
                <div class="status-row" id="timer-row" style="display:none;">
                    <span class="status-label">⏱ Próxima verificação</span>
                    <span class="timer-badge" id="timer-text">—</span>
                </div>
            </div>

            <button class="btn-refresh" id="btn-refresh">↻ Verificar fila agora</button>
            <button class="btn-update" id="btn-update">🔄 Fechar e Atualizar</button>

            <div class="log" id="log"></div>
        </div>
    </div>

    <div class="footer">
        Suporte: <span style="color:#25d366;font-weight:600">WhatsApp +55 11 98894-5503</span>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
