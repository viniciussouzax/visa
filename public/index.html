<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENDS160 — Assessoria de Vistos</title>
    <meta name="description"
        content="Sistema completo de assessoria para formulários DS-160. Preenchimento assistido, automação e gerenciamento de solicitantes.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-body);
        }

        /* Hero */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
        }

        .hero-logo {
            width: 80px;
            margin-bottom: 24px;
            opacity: .85;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -.5px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all .2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .hero-btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, .25);
        }

        .hero-btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, .3);
        }

        .hero-btn-outline {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .hero-btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Footer */
        .landing-footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
        }
    </style>
</head>

<body class="no-sidebar">
    <section class="hero">
        <img src="logo-azul.png" alt="SENDS160" class="hero-logo">
        <h1>SENDS160</h1>
        <p>Sistema completo de assessoria para formulários DS-160. Preenchimento assistido, automação e gerenciamento de
            solicitantes.</p>
        <div class="hero-actions">
            <a href="dashboard.html" class="hero-btn hero-btn-primary">Acessar Dashboard</a>
        </div>
    </section>

    <footer class="landing-footer">
        &copy; 2026 SENDS160. Todos os direitos reservados.
    </footer>
</body>

</html>
