<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS-160 — Preferências da Organização</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-core.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-body, #f0f2f5);
            color: var(--text, #1e293b);
        }

        .pref-layout {
            display: flex;
            min-height: 100vh;
        }

        .pref-sidebar {
            width: 220px;
            background: var(--sidebar-bg, #1e293b);
            padding: 20px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .pref-sidebar .brand {
            padding: 0 20px 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.5px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            margin-bottom: 12px;
        }

        .pref-sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: rgba(255, 255, 255, .7);
            text-decoration: none;
            font-size: 13px;
            transition: all .15s;
            cursor: pointer;
        }

        .pref-sidebar .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, .08);
        }

        .pref-sidebar .nav-link.active {
            color: #fff;
            background: rgba(59, 130, 246, .25);
            border-left: 3px solid #3b82f6;
        }

        .pref-sidebar .spacer {
            flex: 1;
        }

        .pref-main {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
            background: var(--bg-body, #f0f2f5);
        }

        .pref-header {
            margin-bottom: 28px;
        }

        .pref-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text, #1e293b);
            margin: 0 0 4px;
        }

        .pref-header p {
            font-size: 13px;
            color: var(--text-muted, #64748b);
            margin: 0;
        }

        .pref-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 900px;
        }

        @media (max-width: 900px) {
            .pref-grid {
                grid-template-columns: 1fr;
            }
        }

        .pref-card {
            background: var(--bg-card, #fff);
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 12px;
            padding: 24px;
        }

        .pref-card.full {
            grid-column: 1 / -1;
        }

        .pref-card h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 16px;
            color: var(--text, #1e293b);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pref-card h2 .icon {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted, #64748b);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-body, #f0f2f5);
            color: var(--text, #1e293b);
            transition: border-color .15s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
        }

        .form-group input[readonly] {
            background: var(--bg-body, #f0f2f5);
            color: var(--text-muted, #64748b);
            cursor: default;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 48px;
        }

        .btn-save {
            padding: 9px 20px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }

        .btn-save:hover {
            background: #2563eb;
        }

        .btn-save:disabled {
            opacity: .6;
            cursor: default;
        }

        .link-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .link-row input {
            flex: 1;
        }

        .link-row button {
            padding: 9px 16px;
            background: var(--bg-body, #f0f2f5);
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }

        .link-row button:hover {
            background: #e2e8f0;
        }

        .assessor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .assessor-table th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted, #64748b);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border, #e2e8f0);
            font-weight: 600;
        }

        .assessor-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border, #e2e8f0);
            color: var(--text, #1e293b);
        }

        .assessor-table tr:last-child td {
            border-bottom: none;
        }

        .empty-text {
            font-size: 13px;
            color: var(--text-muted, #64748b);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            z-index: 9999;
            animation: fadeIn .2s;
        }

        .toast.success {
            background: #22c55e;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="pref-layout">
        <!-- Sidebar -->
        <div class="pref-sidebar">
            <div class="brand">SENDS160</div>
            <div class="nav-link active"><span>⚙️</span> Preferências</div>
            <div class="nav-link" onclick="AppCore.goToDashboard()"><span>📊</span> Dashboard</div>
            <div class="spacer"></div>
            <div class="nav-link" onclick="AppCore.goToDashboard()"><span>←</span> Voltar</div>
        </div>

        <!-- Main Content -->
        <div class="pref-main">
            <div class="pref-header">
                <h1>Preferências da Organização</h1>
                <p id="orgName">Carregando...</p>
            </div>

            <div class="pref-grid">
                <!-- Dados da Empresa -->
                <div class="pref-card">
                    <h2><span class="icon">🏢</span> Dados da Empresa</h2>
                    <form id="orgForm" onsubmit="saveOrgData(event)">
                        <div class="form-group">
                            <label for="companyName">Nome da Empresa</label>
                            <input type="text" id="companyName" placeholder="Nome da empresa" readonly>
                        </div>
                        <div class="form-group">
                            <label for="shortId">Identificador (short_id)</label>
                            <input type="text" id="shortId" readonly>
                        </div>
                        <div class="form-group">
                            <label for="companyEmail">E-mail de contato</label>
                            <input type="email" id="companyEmail" placeholder="contato@empresa.com">
                        </div>
                        <div class="form-group">
                            <label for="companyPhone">Telefone</label>
                            <input type="tel" id="companyPhone" placeholder="(00) 00000-0000">
                        </div>
                        <div class="form-group">
                            <label for="companyCnpj">CNPJ</label>
                            <input type="text" id="companyCnpj" placeholder="00.000.000/0000-00">
                        </div>
                        <div class="form-group">
                            <label for="companyAddress">Endereço</label>
                            <textarea id="companyAddress" rows="2" placeholder="Endereço completo"></textarea>
                        </div>
                        <button type="submit" class="btn-save" id="saveOrgBtn">Salvar Alterações</button>
                    </form>
                </div>

                <!-- Configurações de Preenchimento -->
                <div class="pref-card">
                    <h2><span class="icon">📝</span> Configurações de Preenchimento</h2>
                    <form id="settingsForm" onsubmit="saveSettings(event)">
                        <div class="form-group">
                            <label for="defaultConsulate">Consulado Padrão</label>
                            <select id="defaultConsulate">
                                <option value="">Selecione...</option>
                                <option value="SAO PAULO">São Paulo</option>
                                <option value="RIO DE JANEIRO">Rio de Janeiro</option>
                                <option value="BRASILIA">Brasília</option>
                                <option value="RECIFE">Recife</option>
                                <option value="PORTO ALEGRE">Porto Alegre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="defaultVisaType">Tipo de Visto Padrão</label>
                            <select id="defaultVisaType">
                                <option value="">Selecione...</option>
                                <option value="B1/B2">B1/B2 - Turismo/Negócios</option>
                                <option value="F1">F1 - Estudante</option>
                                <option value="J1">J1 - Intercâmbio</option>
                                <option value="H1B">H1B - Trabalho</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-save">Salvar Configurações</button>
                    </form>

                    <div style="margin-top:24px; border-top: 1px solid var(--border, #e2e8f0); padding-top: 20px;">
                        <h2 style="margin-top:0"><span class="icon">🔗</span> Link do Portal</h2>
                        <p class="empty-text" style="margin-bottom:10px">Compartilhe com seus solicitantes:</p>
                        <div class="link-row">
                            <input type="text" id="formLink" readonly>
                            <button onclick="copyFormLink()">📋 Copiar</button>
                        </div>
                    </div>
                </div>

                <!-- Assessores -->
                <div class="pref-card full">
                    <h2><span class="icon">👥</span> Assessores da Organização</h2>
                    <div id="assessorsList">
                        <p class="empty-text">Carregando assessores...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = AppCore.SUPABASE_URL;
        const SUPABASE_KEY = AppCore.SUPABASE_KEY;
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let _orgParam = AppCore.getOrg();
        let _companyId = null;
        let _companyData = null;

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        (async function init() {
            let sessionOk = false;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    window._sessionToken = session.access_token;
                    AppCore.setSession(session.access_token, null);
                    sessionOk = true;
                }
            } catch { }

            if (!sessionOk) {
                const authToken = AppCore.getAuth();
                if (authToken && authToken !== SUPABASE_KEY) {
                    window._sessionToken = authToken;
                    sessionOk = true;
                }
            }

            if (!sessionOk) {
                window.location.href = AppCore.buildUrl('dashboard.html');
                return;
            }

            await loadOrgData();
            await loadAssessors();
            generateFormLink();
        })();

        async function loadOrgData() {
            if (!_orgParam) {
                document.getElementById('orgName').textContent = 'Nenhuma organização vinculada';
                return;
            }
            try {
                const rows = await AppCore.sbGet(
                    'companies?short_id=eq.' + encodeURIComponent(_orgParam) +
                    '&select=id,name,short_id,email,phone,cnpj,address,settings&limit=1'
                );
                if (rows?.[0]) {
                    _companyData = rows[0];
                    _companyId = rows[0].id;
                    document.getElementById('orgName').textContent = rows[0].name || '—';
                    document.getElementById('companyName').value = rows[0].name || '';
                    document.getElementById('shortId').value = rows[0].short_id || '';
                    document.getElementById('companyEmail').value = rows[0].email || '';
                    document.getElementById('companyPhone').value = rows[0].phone || '';
                    document.getElementById('companyCnpj').value = rows[0].cnpj || '';
                    document.getElementById('companyAddress').value = rows[0].address || '';
                    const settings = rows[0].settings || {};
                    document.getElementById('defaultConsulate').value = settings.default_consulate || '';
                    document.getElementById('defaultVisaType').value = settings.default_visa_type || '';
                }
            } catch (e) {
                console.error('[Prefs] Load error:', e);
                document.getElementById('orgName').textContent = 'Erro ao carregar';
            }
        }

        async function saveOrgData(e) {
            e.preventDefault();
            if (!_companyId) return;
            const btn = document.getElementById('saveOrgBtn');
            btn.disabled = true; btn.textContent = 'Salvando...';
            try {
                await AppCore.sbFetch('companies?id=eq.' + _companyId, 'PATCH', {
                    email: document.getElementById('companyEmail').value.trim(),
                    phone: document.getElementById('companyPhone').value.trim(),
                    cnpj: document.getElementById('companyCnpj').value.trim(),
                    address: document.getElementById('companyAddress').value.trim(),
                });
                showToast('Dados salvos!', 'success');
            } catch (e) { showToast('Erro ao salvar: ' + e.message, 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Salvar Alterações'; }
        }

        async function saveSettings(e) {
            e.preventDefault();
            if (!_companyId) return;
            try {
                const settings = {
                    default_consulate: document.getElementById('defaultConsulate').value,
                    default_visa_type: document.getElementById('defaultVisaType').value,
                };
                await AppCore.sbFetch('companies?id=eq.' + _companyId, 'PATCH', { settings });
                showToast('Configurações salvas!', 'success');
            } catch (e) { showToast('Erro: ' + e.message, 'error'); }
        }

        async function loadAssessors() {
            if (!_companyId) {
                document.getElementById('assessorsList').innerHTML = '<p class="empty-text">Nenhuma organização vinculada.</p>';
                return;
            }
            try {
                const rows = await AppCore.sbGet(
                    'members?company_id=eq.' + _companyId + '&select=id,email,role,created_at&order=created_at.asc'
                );
                if (!rows || !rows.length) {
                    document.getElementById('assessorsList').innerHTML = '<p class="empty-text">Nenhum assessor cadastrado.</p>';
                    return;
                }
                let html = '<table class="assessor-table"><thead><tr><th>E-mail</th><th>Perfil</th><th>Desde</th></tr></thead><tbody>';
                rows.forEach(m => {
                    const date = m.created_at ? new Date(m.created_at).toLocaleDateString('pt-BR') : '—';
                    html += `<tr><td>${m.email}</td><td>${m.role || 'assessor'}</td><td>${date}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('assessorsList').innerHTML = html;
            } catch (e) {
                document.getElementById('assessorsList').innerHTML = '<p class="empty-text">Erro ao carregar assessores.</p>';
            }
        }

        function generateFormLink() {
            const baseUrl = location.origin + location.pathname.replace('preferencias.html', '');
            const link = baseUrl + 'portal.html' + (_orgParam ? '?org=' + encodeURIComponent(_orgParam) : '');
            document.getElementById('formLink').value = link;
        }

        function copyFormLink() {
            const link = document.getElementById('formLink').value;
            navigator.clipboard.writeText(link)
                .then(() => showToast('Link copiado!', 'success'))
                .catch(() => showToast('Erro ao copiar', 'error'));
        }
    </script>
</body>

</html>
