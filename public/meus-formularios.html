<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS-160 — Meus Formulários</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="app-core.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1e293b;
            min-height: 100vh;
        }

        /* Header bar */
        .top-bar {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .top-bar .brand {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -.3px;
        }

        .top-bar .brand span {
            color: #3b82f6;
        }

        .top-bar .back-btn {
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .15s;
        }

        .top-bar .back-btn:hover {
            color: #3b82f6;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px 12px 6px 8px;
            border-radius: 99px;
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }

        .user-chip .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #3b82f6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        /* Page content */
        .page-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title-row h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .page-title-row .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        /* CTA button */
        .btn-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(59, 130, 246, .25);
        }

        .btn-cta:hover {
            background: #2563eb;
            box-shadow: 0 4px 16px rgba(59, 130, 246, .3);
            transform: translateY(-1px);
        }

        .btn-cta:active {
            transform: translateY(0);
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-chip {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 16px;
            flex: 1;
            text-align: center;
        }

        .stat-chip .num {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
        }

        .stat-chip .lbl {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #94a3b8;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Cards */
        .form-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .form-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, .08);
            transform: translateY(-2px);
        }

        .form-card .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .form-card .card-icon.triagem {
            background: #dbeafe;
        }

        .form-card .card-icon.analise {
            background: #fef3c7;
        }

        .form-card .card-icon.ds160 {
            background: #e0e7ff;
        }

        .form-card .card-icon.taxas {
            background: #fce7f3;
        }

        .form-card .card-icon.agendamento {
            background: #ccfbf1;
        }

        .form-card .card-icon.entrevista {
            background: #f3e8ff;
        }

        .form-card .card-icon.status {
            background: #dcfce7;
        }

        .form-card .card-icon.arquivado {
            background: #f1f5f9;
        }

        .form-card .card-body {
            flex: 1;
            min-width: 0;
        }

        .form-card .card-name {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .form-card .card-meta {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .card-stage-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        .card-stage-badge.triagem {
            background: #dbeafe;
            color: #2563eb;
        }

        .card-stage-badge.analise {
            background: #fef3c7;
            color: #d97706;
        }

        .card-stage-badge.ds160 {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .card-stage-badge.taxas {
            background: #fce7f3;
            color: #db2777;
        }

        .card-stage-badge.agendamento {
            background: #ccfbf1;
            color: #0d9488;
        }

        .card-stage-badge.entrevista {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .card-stage-badge.status {
            background: #dcfce7;
            color: #16a34a;
        }

        .card-stage-badge.arquivado {
            background: #f1f5f9;
            color: #64748b;
        }

        .form-card .card-progress {
            width: 80px;
            flex-shrink: 0;
            text-align: center;
        }

        .form-card .card-progress .pct {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
        }

        .form-card .card-progress .pbar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 99px;
            margin-top: 4px;
            overflow: hidden;
        }

        .form-card .card-progress .pbar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width .3s;
        }

        .form-card .card-arrow {
            color: #94a3b8;
            font-size: 18px;
            flex-shrink: 0;
            transition: all .15s;
        }

        .form-card:hover .card-arrow {
            color: #3b82f6;
            transform: translateX(3px);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Loading */
        .loading-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 60px;
            color: #94a3b8;
            font-size: 13px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            z-index: 9999;
            animation: fadeUp .2s;
        }

        .toast.success {
            background: #22c55e;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .stats-bar {
                flex-direction: column;
            }

            .form-card {
                flex-wrap: wrap;
            }

            .form-card .card-progress {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .form-card .card-progress .pbar {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div style="display:flex;align-items:center;gap:16px">
            <div class="brand">SEND<span>S160</span></div>
            <a href="#" id="backLink" class="back-btn">← Voltar ao Portal</a>
        </div>
        <div class="user-chip" id="userChip">
            <div class="avatar" id="userAvatar">?</div>
            <span id="userEmail">—</span>
        </div>
    </div>

    <!-- Content -->
    <div class="page-wrap">
        <div class="page-title-row">
            <div>
                <h1>📋 Meus Formulários</h1>
                <div class="subtitle" id="orgLabel"></div>
            </div>
            <button class="btn-cta" onclick="createNewForm()">＋ Nova Solicitação</button>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar" style="display:none">
            <div class="stat-chip">
                <div class="num" id="statTotal">0</div>
                <div class="lbl">Total</div>
            </div>
            <div class="stat-chip">
                <div class="num" id="statProgress">0</div>
                <div class="lbl">Em Andamento</div>
            </div>
            <div class="stat-chip">
                <div class="num" id="statDone">0</div>
                <div class="lbl">Concluídos</div>
            </div>
        </div>

        <!-- Form list -->
        <div class="form-list" id="formList"></div>

        <!-- Empty state -->
        <div id="emptyState" style="display:none">
            <div class="empty-state">
                <div class="icon">📄</div>
                <h3>Nenhum formulário encontrado</h3>
                <p>Clique em "Nova Solicitação" para começar seu primeiro formulário DS-160.</p>
                <button class="btn-cta" onclick="createNewForm()">Criar Primeiro Formulário</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="loading-box">
            <div class="spinner"></div>
            <span>Carregando formulários...</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = AppCore.SUPABASE_URL;
        const SUPABASE_KEY = AppCore.SUPABASE_KEY;

        let _email = sessionStorage.getItem('client_email');
        let _companyId = sessionStorage.getItem('client_company_id');
        let _orgParam = sessionStorage.getItem('client_org');
        let _orgName = sessionStorage.getItem('client_org_name');
        let _forms = [];

        if (!_email) { window.location.href = 'portal.html'; }

        // Back link
        document.getElementById('backLink').href = 'portal.html' + (_orgParam ? '?org=' + _orgParam : '');

        // User info
        if (_email) {
            document.getElementById('userEmail').textContent = _email;
            document.getElementById('userAvatar').textContent = _email.substring(0, 2).toUpperCase();
        }
        if (_orgName) document.getElementById('orgLabel').textContent = _orgName;

        const STAGE_LABELS = {
            triagem: 'Triagem', analise: 'Análise', ds160: 'DS-160',
            taxas: 'Taxas', agendamento: 'Agendamento',
            entrevista: 'Entrevista', status: 'Status', arquivado: 'Arquivado'
        };
        const STAGE_ICONS = {
            triagem: '📥', analise: '🔍', ds160: '📝',
            taxas: '💳', agendamento: '📅',
            entrevista: '🎤', status: '✅', arquivado: '📦'
        };

        function calcProgress(data) {
            if (!data || typeof data !== 'object') return 0;
            let total = 0, filled = 0;
            Object.values(data).forEach(sec => {
                if (typeof sec !== 'object' || Array.isArray(sec)) return;
                Object.values(sec).forEach(v => { total++; if (v !== null && v !== undefined && v !== '' && v !== 'N/S') filled++; });
            });
            return total ? Math.round((filled / total) * 100) : 0;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const m = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
            return `${d.getDate().toString().padStart(2, '0')} ${m[d.getMonth()]} ${d.getFullYear()}`;
        }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        async function loadForms() {
            document.getElementById('loadingState').style.display = 'flex';
            try {
                const cached = sessionStorage.getItem('client_results');
                if (cached) {
                    _forms = JSON.parse(cached);
                    sessionStorage.removeItem('client_results');
                } else {
                    let q = 'applicants?or=(data->>email.ilike.' + encodeURIComponent(_email) +
                        ',data->personal1->>email.ilike.' + encodeURIComponent(_email) +
                        ',data->contact->>email.ilike.' + encodeURIComponent(_email) +
                        ')&select=id,full_name,data,stage,created_at&order=created_at.desc';
                    if (_companyId) q = 'applicants?company_id=eq.' + _companyId + '&' + q.replace('applicants?', '');
                    const rows = await AppCore.sbGet(q);
                    _forms = rows || [];
                }
                renderForms();
            } catch (e) {
                console.error('[Forms] Load error:', e);
                document.getElementById('formList').innerHTML = '<div class="empty-state"><h3>Erro ao carregar</h3><p>' + e.message + '</p></div>';
            } finally {
                document.getElementById('loadingState').style.display = 'none';
                AppCore.hideLoading();
            }
        }

        function renderForms() {
            const container = document.getElementById('formList');
            const emptyEl = document.getElementById('emptyState');
            const statsBar = document.getElementById('statsBar');

            if (!_forms.length) {
                container.innerHTML = '';
                emptyEl.style.display = 'block';
                statsBar.style.display = 'none';
                return;
            }
            emptyEl.style.display = 'none';
            statsBar.style.display = 'flex';

            // Stats
            document.getElementById('statTotal').textContent = _forms.length;
            document.getElementById('statProgress').textContent = _forms.filter(f => f.stage !== 'arquivado' && f.stage !== 'status').length;
            document.getElementById('statDone').textContent = _forms.filter(f => f.stage === 'status' || f.stage === 'arquivado').length;

            container.innerHTML = _forms.map(form => {
                const name = form.full_name || 'Formulário sem nome';
                const stage = form.stage || 'triagem';
                const stageLabel = STAGE_LABELS[stage] || stage;
                const stageIcon = STAGE_ICONS[stage] || '📄';
                const progress = calcProgress(form.data);
                const pc = progress >= 80 ? '#22c55e' : progress > 40 ? '#3b82f6' : '#f59e0b';
                return `
                <div class="form-card" onclick="openForm('${form.id}')">
                    <div class="card-icon ${stage}">${stageIcon}</div>
                    <div class="card-body">
                        <div class="card-name">${name}</div>
                        <div class="card-meta">
                            <span class="card-stage-badge ${stage}">${stageLabel}</span>
                            <span>${formatDate(form.created_at)}</span>
                        </div>
                    </div>
                    <div class="card-progress">
                        <div class="pct">${progress}%</div>
                        <div class="pbar"><div class="pbar-fill" style="width:${progress}%;background:${pc}"></div></div>
                    </div>
                    <div class="card-arrow">→</div>
                </div>`;
            }).join('');
        }

        function openForm(id) {
            sessionStorage.setItem('client_app_id', id);
            window.location.href = 'index.html?id=' + id + '&secure_entry=1';
        }

        async function createNewForm() {
            try {
                const payload = {
                    full_name: 'Novo Solicitante',
                    data: { personal1: { email: _email } },
                    stage: 'triagem', status: 'aguardando_execucao', result: 'indefinido', priority: 'normal'
                };
                if (_companyId) payload.company_id = _companyId;
                const result = await AppCore.sbFetch('applicants', 'POST', payload);
                if (result?.[0]) {
                    showToast('Formulário criado!', 'success');
                    openForm(result[0].id);
                } else {
                    showToast('Erro: resposta inesperada', 'error');
                }
            } catch (e) {
                console.error('[Forms] Create error:', e);
                showToast('Erro ao criar: ' + e.message, 'error');
            }
        }

        loadForms();
    </script>
</body>

</html>
