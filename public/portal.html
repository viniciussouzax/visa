<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS-160 — Portal do Solicitante</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app-core.js"></script>
    <style>
        /* Portal-specific: full-page centered, no sidebar */
        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #e8edf5 50%, #f0f4ff 100%);
            justify-content: center;
            align-items: center;
        }

        .portal-card {
            padding: 28px 24px;
            border-radius: 12px;
            width: 380px;
            max-width: 92vw;
            border: 1px solid var(--border);
            background: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .08);
            text-align: center;
            animation: slideUp .25s ease;
        }

        .portal-card h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -.3px;
        }

        .portal-card .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .portal-field {
            margin-bottom: 14px;
            text-align: left;
        }

        .portal-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-secondary);
        }

        .portal-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            outline: none;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .portal-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        .portal-field input::placeholder {
            color: var(--text-muted);
        }

        .portal-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 4px;
        }

        .portal-btn:hover {
            background: var(--accent-hover);
        }

        .portal-btn:disabled {
            opacity: .7;
        }

        .portal-error {
            font-size: 13px;
            color: var(--danger);
            margin-top: 12px;
            display: none;
        }

        .portal-error.show {
            display: block;
        }

        .portal-trust {
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .portal-trust::before {
            content: '🔒';
        }

        .portal-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .portal-brand::before {
            content: '';
            width: 6px;
            height: 20px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border-radius: 3px;
        }

        .portal-brand span {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="portal-card">
        <div class="portal-brand"><span>SENDS160</span></div>
        <h1>Portal do Solicitante</h1>
        <p class="subtitle" id="orgLabel">Insira seu e-mail para acessar seus formulários DS-160.</p>

        <form id="searchForm" onsubmit="searchByEmail(event)">
            <div class="portal-field">
                <label for="emailInput">E-mail</label>
                <input type="email" id="emailInput" placeholder="seu@email.com" required autocomplete="email">
            </div>
            <button type="submit" id="submitBtn" class="portal-btn">Buscar Formulários</button>
        </form>

        <div id="errorMsg" class="portal-error">
            <span id="errorText">E-mail não encontrado.</span>
        </div>

        <div class="portal-trust">Acesso encriptado Fim-a-Fim</div>
    </div>

    <script>
        const sbGet = AppCore.sbGet;
        const _params = new URLSearchParams(location.search);
        const _idParam = _params.get('id');
        const _orgParam = _params.get('org');

        let _companyId = null;
        let _orgName = '';

        // Retrocompatibilidade: ?id= redireciona direto
        if (_idParam) {
            sessionStorage.setItem('client_app_id', _idParam);
            window.location.href = 'index.html?id=' + _idParam + '&secure_entry=1';
        }

        // Validate org param — mandatory
        async function initPortal() {
            if (!_orgParam) {
                showOrgError();
                AppCore.hideLoading();
                return;
            }
            try {
                const rows = await sbGet('companies?short_id=eq.' + encodeURIComponent(_orgParam) + '&select=id,name&limit=1');
                if (!rows || !rows[0]) {
                    showOrgError();
                    AppCore.hideLoading();
                    return;
                }
                _companyId = rows[0].id;
                _orgName = rows[0].name || _orgParam;
                document.getElementById('orgLabel').textContent = _orgName + ' — Insira seu e-mail para acessar seus formulários DS-160.';
            } catch (e) {
                console.error('[Portal] Org resolve error:', e);
                showOrgError();
            }
            AppCore.hideLoading();
        }

        function showOrgError() {
            document.getElementById('searchForm').style.display = 'none';
            document.getElementById('errorText').textContent = 'Link inválido. Este portal precisa ser acessado através do link fornecido pela sua organização.';
            document.getElementById('errorMsg').classList.add('show');
        }

        async function searchByEmail(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errEl = document.getElementById('errorMsg');
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            if (!email || !_companyId) return;

            btn.disabled = true;
            btn.textContent = 'Buscando...';
            errEl.classList.remove('show');

            try {
                const rows = await sbGet(
                    'applicants?company_id=eq.' + _companyId +
                    '&or=(data->>email.ilike.' + encodeURIComponent(email) +
                    ',data->personal1->>email.ilike.' + encodeURIComponent(email) +
                    ',data->contact->>email.ilike.' + encodeURIComponent(email) +
                    ')&select=id,full_name,data,stage,created_at&order=created_at.desc'
                );

                // Save to session and redirect — even with 0 results
                // meus-formularios.html shows empty state with "Create New" button
                sessionStorage.setItem('client_email', email);
                sessionStorage.setItem('client_company_id', _companyId);
                sessionStorage.setItem('client_org', _orgParam);
                sessionStorage.setItem('client_org_name', _orgName);
                sessionStorage.setItem('client_results', JSON.stringify(rows || []));
                window.location.href = 'meus-formularios.html';
            } catch (err) {
                document.getElementById('errorText').textContent = 'Erro ao buscar: ' + err.message;
                errEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buscar Formulários';
            }
        }

        initPortal();
    </script>
</body>

</html>
